<div class="reset-page">
    <mat-card class="reset-card">
        <div class="reset-header">
            <mat-icon>lock_reset</mat-icon>
            <h2>Reset Password</h2>
            <p>You must reset your temporary password before accessing dashboard.</p>
        </div>

        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>New Password</mat-label>
                <input matInput [type]="hideNewPassword ? 'password' : 'text'" formControlName="newPassword" />
                <button mat-icon-button matSuffix type="button" (click)="hideNewPassword = !hideNewPassword">
                    <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="resetForm.get('newPassword')?.hasError('required')">
                    New password is required
                </mat-error>
                <mat-error *ngIf="resetForm.get('newPassword')?.hasError('minlength')">
                    Password must be at least 6 characters
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Confirm Password</mat-label>
                <input matInput [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword" />
                <button mat-icon-button matSuffix type="button" (click)="hideConfirmPassword = !hideConfirmPassword">
                    <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error *ngIf="resetForm.get('confirmPassword')?.hasError('required')">
                    Confirm password is required
                </mat-error>
            </mat-form-field>

            <p class="error-text" *ngIf="resetForm.hasError('passwordMismatch')">
                Passwords do not match
            </p>

            <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="loading">
                {{ loading ? 'Resetting...' : 'Reset Password' }}
            </button>
        </form>
    </mat-card>
</div>
