<mat-toolbar class="navbar">

    <mat-icon>local_hospital</mat-icon>
    <span>HMS</span>
  </div>

  <span class="spacer"></span>

  <span class="role" *ngIf="role">Role: {{ role }}</span>

    <span>Logout</span>
  </button>
</mat-toolbar>
