<div class="sidebar">
    <div class="sidebar-title">
        <mat-icon>medical_services</mat-icon>
        <span>Menu</span>
    </div>

    <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
            <mat-icon>dashboard</mat-icon>
            <span>Dashboard</span>
        </a>

        @if (isAdminOrTechnician()) {
        <a mat-list-item routerLink="/employees" routerLinkActive="active">
            <mat-icon>groups</mat-icon>
            <span>Employee List</span>
        </a>
        } @if (isAdminOrReceptionist()) {
        <a mat-list-item routerLink="/patients" routerLinkActive="active">
            <mat-icon>personal_injury</mat-icon>
            <span>Patients</span>
        </a>
        } @if (isAdminOrReceptionistOrDoctor()) {
        <a mat-list-item routerLink="/appointments" routerLinkActive="active">
            <mat-icon>event_available</mat-icon>
            <span>Appointments</span>
        </a>
        }

        <a mat-list-item routerLink="/profile" routerLinkActive="active">
            <mat-icon>person</mat-icon>
            <span>Profile</span>
        </a>
    </mat-nav-list>
</div>
