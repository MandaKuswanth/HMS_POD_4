<div class="page-container">
  <div class="header-section">
    <h2>Health Records</h2>
    <button *appHasPermission="PERMISSIONS.HEALTH_RECORD_CREATE" mat-raised-button color="primary">
      <mat-icon>add</mat-icon>
      Add Record
    </button>
  </div>

  <mat-card class="table-card">
    <mat-card-content>
      <div class="table-container">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z0">
          
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef> Date </th>
            <td mat-cell *matCellDef="let record"> {{ record.created_at | date }} </td>
          </ng-container>

          <ng-container matColumnDef="patientId">
            <th mat-header-cell *matHeaderCellDef> Patient ID </th>
            <td mat-cell *matCellDef="let record"> {{ record.patientId }} </td>
          </ng-container>

          <ng-container matColumnDef="symptoms">
            <th mat-header-cell *matHeaderCellDef> Symptoms </th>
            <td mat-cell *matCellDef="let record"> {{ record.symptoms }} </td>
          </ng-container>

          <ng-container matColumnDef="diagnosis">
            <th mat-header-cell *matHeaderCellDef> Diagnosis </th>
            <td mat-cell *matCellDef="let record"> {{ record.diagnosis }} </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Actions </th>
            <td mat-cell *matCellDef="let record">
              <button *appHasPermission="PERMISSIONS.HEALTH_RECORD_VIEW" mat-icon-button color="primary">
                <mat-icon>visibility</mat-icon>
              </button>
              <button *appHasPermission="PERMISSIONS.HEALTH_RECORD_DELETE" mat-icon-button color="warn">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="5" style="text-align: center; padding: 20px;">
              No health records found.
            </td>
          </tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of health records"></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
