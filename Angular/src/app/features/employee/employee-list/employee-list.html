

    <div class="employee-page">
      <mat-card class="main-card">
        <div class="card-header">
          <h2 class="page-title">Employee Management</h2>
        </div>

        <div class="toolbar-row">
          <div class="search-box">
            <input type="text" [ngModel]="searchTextSignal()" (input)="onSearchInput($event)" placeholder="Search by code, name, email or phone...">
          </div>

          <div class="filter-box">
            <select [value]="roleSignal()" (change)="onRoleChange($any($event.target).value)">
              <option value="">ALL ROLES</option>
              @for (r of rolesList; track r) { <option [value]="r">{{r}}</option> }
            </select>
          </div>

          <div class="filter-box dept-box">
            <select [value]="departmentSignal()" (change)="onDepartmentChange($any($event.target).value)">
              <option value="">ALL DEPARTMENTS</option>
              @for (dept of departmentsList; track dept) { <option [value]="dept">{{dept}}</option> }
            </select>
          </div>

          <div class="status-pills">
            <button class="pill-btn" [class.active]="statusSignal() === 'all'" (click)="setView('all')">
              All <span class="badge">{{ totalSignal() }}</span>
            </button>
            <button class="pill-btn" [class.active]="statusSignal() === 'active'" (click)="setView('active')">
              Active <span class="badge">0</span>
            </button>
            <button class="pill-btn" [class.active]="statusSignal() === 'pending'" (click)="setView('pending')">
              Pending <span class="badge">0</span>
            </button>
          </div>

          <button mat-fab color="primary" class="add-fab" (click)="openAddDialog()" *appHasPermission="PERMISSIONS.EMPLOYEE_CREATE">
            <mat-icon>add</mat-icon>
          </button>
        </div>

        <div class="table-scroll">

          <table mat-table [dataSource]="employeesSignal()" multiTemplateDataRows>

            <!-- CODE -->
            <ng-container matColumnDef="employeeCode">
              <th mat-header-cell *matHeaderCellDef>Code</th>
              <td mat-cell *matCellDef="let row">
                {{ row.employeeCode }}
              </td>
            </ng-container>

            <!-- NAME -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let row">
                <div class="employee-name">
                  {{ row.name }}
                </div>
              </td>
            </ng-container>

            <!-- EMAIL -->
            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef>Email</th>
              <td mat-cell *matCellDef="let row">
                {{ row.email }}
              </td>
            </ng-container>

            <!-- PHONE -->
            <ng-container matColumnDef="phone">
              <th mat-header-cell *matHeaderCellDef>Phone</th>
              <td mat-cell *matCellDef="let row">
                {{ row.phone }}
              </td>
            </ng-container>

            <!-- DEPARTMENT -->
            <ng-container matColumnDef="department">
              <th mat-header-cell *matHeaderCellDef>Department</th>
              <td mat-cell *matCellDef="let row">
                {{ row.department }}
              </td>
            </ng-container>

            <!-- DESIGNATION -->
            <ng-container matColumnDef="designation">
              <th mat-header-cell *matHeaderCellDef>Designation</th>
              <td mat-cell *matCellDef="let row">
                {{ row.designation }}
              </td>
            </ng-container>

            <!-- ROLE -->
            <ng-container matColumnDef="role">
              <th mat-header-cell *matHeaderCellDef>Role</th>
              <td mat-cell *matCellDef="let row">
                <span class="role-badge">
                  {{ row.role || 'N/A' }}
                </span>
              </td>
            </ng-container>

            <!-- STATUS -->
            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef>Status</th>
              <td mat-cell *matCellDef="let row">
                <span class="status-badge" [ngClass]="row.status ? 'active' : 'inactive'">
                  {{ row.status ? 'Active' : 'Inactive' }}
                </span>
              </td>
            </ng-container>

            <!-- HEADER -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

            <!-- DATA ROW -->
            <tr mat-row *matRowDef="let row; columns: displayedColumns" class="employee-row" tabindex="0"
              (click)="toggleRow(row)" (keydown.enter)="toggleRow(row)" (keydown.space)="toggleRow(row)">
            </tr>

            <!-- EXPANDED PANEL -->
            <ng-container matColumnDef="expandedDetail">
              <td mat-cell *matCellDef="let row" [attr.colspan]="displayedColumns.length">

                <div class="employee-action-panel" *ngIf="expandedEmployeeSignal()?.employeeCode === row.employeeCode">

                  <div class="employee-action-info">
                    <strong>{{ row.name }}</strong>
                    <span>{{ row.employeeCode }}</span>
                  </div>

                  <div class="employee-action-buttons">

                    <button *appHasPermission="PERMISSIONS.EMPLOYEE_UPDATE" mat-stroked-button class="status-btn"
                      [ngClass]="row.status ? 'deactivate-btn' : 'activate-btn'" (click)="toggleEmployeeStatus(row)">
                      {{ row.status ? 'Deactivate' : 'Activate' }}
                    </button>

                    <button *appHasPermission="PERMISSIONS.EMPLOYEE_UPDATE" mat-stroked-button
                      (click)="openEditDialog(row)">
                      <mat-icon>edit</mat-icon>
                      Edit Profile
                    </button>

                    <button *appHasPermission="PERMISSIONS.EMPLOYEE_DELETE" mat-stroked-button
                      (click)="deleteEmployee(row)">
                      <mat-icon>delete</mat-icon>
                      Remove Employee
                    </button>

                  </div>

                </div>

              </td>
            </ng-container>

            <!-- DETAIL ROW -->
            <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="detail-row"
              [class.hidden]="expandedEmployeeSignal()?.employeeCode !== row.employeeCode">
            </tr>

          </table>

        </div>
        <mat-paginator [length]="totalSignal()" [pageSize]="limitSignal()" [pageIndex]="pageSignal()"
          [pageSizeOptions]="pageSizeOptions" showFirstLastButtons (page)="onPageChange($event)">
        </mat-paginator>
      </mat-card>
    </div>
