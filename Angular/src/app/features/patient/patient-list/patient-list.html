

    <div class="patient-page">
      <mat-card class="main-card">
        <div class="card-header">
          <h2 class="page-title">Patient Management</h2>
        </div>

        <div class="toolbar-row">
          <div class="search-box">
            <input type="text" [ngModel]="searchTextSignal()" (input)="onSearchInput($event)" placeholder="Search UHID, name, email, phone...">
          </div>

          <div class="filter-box">
            <select [value]="genderSignal()" (change)="onGenderChange($any($event.target).value)">
              <option value="ALL">ALL GENDERS</option>
              <option value="male">MALE</option>
              <option value="female">FEMALE</option>
            </select>
          </div>

          <div class="status-pills">
            <button class="pill-btn" [class.active]="statusSignal() === 'ALL'" (click)="onStatusChange('ALL')">
              All <span class="badge">{{ totalSignal() }}</span>
            </button>
            <button class="pill-btn" [class.active]="statusSignal() === 'ACTIVE'" (click)="onStatusChange('ACTIVE')">
              Active <span class="badge">0</span>
            </button>
            <button class="pill-btn" [class.active]="statusSignal() === 'INACTIVE'" (click)="onStatusChange('INACTIVE')">
              Inactive <span class="badge">0</span>
            </button>
          </div>

          <button mat-fab color="primary" class="add-fab" (click)="openAddDialog()" *appHasPermission="PERMISSIONS.PATIENT_CREATE">
            <mat-icon>add</mat-icon>
          </button>
        </div>

        <div class="table-scroll">

          <table mat-table [dataSource]="patientsSignal()" multiTemplateDataRows>

            <!-- UHID -->
            <ng-container matColumnDef="UHID">
              <th mat-header-cell *matHeaderCellDef>UHID</th>
              <td mat-cell *matCellDef="let row">
                {{ row.UHID }}
              </td>
            </ng-container>

            <!-- NAME -->
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let row">
                <div class="patient-name">
                  <div class="avatar">
                    {{ row.name?.charAt(0) }}
                  </div>
                  {{ row.name }}
                </div>
              </td>
            </ng-container>

            <!-- EMAIL -->
            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef>Email</th>
              <td mat-cell *matCellDef="let row">
                {{ row.email }}
              </td>
            </ng-container>

            <!-- PHONE -->
            <ng-container matColumnDef="phone">
              <th mat-header-cell *matHeaderCellDef>Phone</th>
              <td mat-cell *matCellDef="let row">
                {{ row.phone }}
              </td>
            </ng-container>

            <!-- GENDER -->
            <ng-container matColumnDef="gender">
              <th mat-header-cell *matHeaderCellDef>Gender</th>
              <td mat-cell *matCellDef="let row">
                <span class="gender-badge">
                  {{ row.gender }}
                </span>
              </td>
            </ng-container>

            <!-- DOB -->
            <ng-container matColumnDef="dob">
              <th mat-header-cell *matHeaderCellDef>DOB</th>
              <td mat-cell *matCellDef="let row">
                {{ row.dob | date:'dd-MM-yyyy' }}
              </td>
            </ng-container>

            <!-- STATUS -->
            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef>Status</th>
              <td mat-cell *matCellDef="let row">
                <span class="status-badge" [ngClass]="row.status ? 'active' : 'inactive'">
                  {{ row.status ? 'Active' : 'Inactive' }}
                </span>
              </td>
            </ng-container>

            <!-- HEADER -->
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

            <!-- DATA ROW -->
            <tr mat-row *matRowDef="let row; columns: displayedColumns" class="patient-row" tabindex="0"
              (click)="onRowClick(row, $event)" (keydown.enter)="onRowClick(row, $event)"
              (keydown.space)="onRowClick(row, $event)">
            </tr>

            <!-- EXPANDED PANEL -->
            <ng-container matColumnDef="expandedDetail">
              <td mat-cell *matCellDef="let row" [attr.colspan]="displayedColumns.length">

                <div class="patient-action-panel" *ngIf="expandedPatientSignal()?.UHID === row.UHID">

                  <div class="patient-action-info">
                    <strong>{{ row.name }}</strong>
                    <span>{{ row.UHID }}</span>
                  </div>

                  <div class="patient-action-buttons">

                    <button *appHasPermission="PERMISSIONS.PATIENT_UPDATE" mat-stroked-button class="status-btn"
                      [ngClass]="row.status ? 'deactivate-btn' : 'activate-btn'" (click)="toggleStatus(row)">
                      {{ row.status ? 'Deactivate' : 'Activate' }}
                    </button>

                    <button *appHasPermission="PERMISSIONS.PATIENT_READ" mat-stroked-button (click)="viewPatient(row)">
                      <mat-icon>visibility</mat-icon>
                      View Patient
                    </button>

                    <button *appHasPermission="PERMISSIONS.PATIENT_UPDATE" mat-stroked-button
                      (click)="editPatient(row)">
                      <mat-icon>edit</mat-icon>
                      Update Patient
                    </button>

                    <button *appHasPermission="PERMISSIONS.PATIENT_DELETE" mat-stroked-button
                      (click)="deletePatient(row)">
                      <mat-icon>delete</mat-icon>
                      Delete Patient
                    </button>

                  </div>

                </div>

              </td>
            </ng-container>

            <!-- DETAIL ROW -->
            <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="detail-row"
              [class.hidden]="expandedPatientSignal()?.UHID !== row.UHID">
            </tr>

          </table>

        </div>
        <mat-paginator [length]="totalSignal()" [pageSize]="limitSignal()" [pageIndex]="pageSignal()"
          [pageSizeOptions]="pageSizeOptions" showFirstLastButtons (page)="onPageChange($event)">
        </mat-paginator>
      </mat-card>

    </div>
