<h2 mat-dialog-title>
  {{ data.mode === 'add' ? 'Add Role' : 'Edit Role' }}
</h2>

<mat-dialog-content class="dialog-content">

  <div class="form-grid">

    <mat-form-field appearance="outline">
      <mat-label>Role Name</mat-label>
      <input
        matInput
        [(ngModel)]="form.name"
        placeholder="ADMIN"
        [disabled]="data.mode === 'edit' && form.name === 'SUPER_ADMIN'"
      />
    </mat-form-field>

    <div class="form-field-wrapper">
      <label class="field-label">Status</label>
      <app-search-dropdown
        [searchFn]="searchStatus"
        [displayField]="'name'"
        [valueField]="'_id'"
        [initialDisplay]="form.status ? 'Active' : 'Inactive'"
        [(ngModel)]="form.status"
        placeholder="Select status..."
      ></app-search-dropdown>
    </div>

  </div>

  <mat-form-field appearance="outline" class="full-width" style="margin-top: 15px;">
    <mat-label>Description</mat-label>
    <textarea
      matInput
      rows="2"
      [(ngModel)]="form.description"
      placeholder="Role description"
    ></textarea>
  </mat-form-field>

  <h3 class="section-title">Permissions</h3>

  <div class="permission-groups">
    @for (group of permissionGroups; track group.title) {
      <div class="permission-card">
        <h4>{{ group.title }}</h4>

        <div class="permission-grid">
          @for (permission of group.permissions; track permission) {
            <mat-checkbox
              [checked]="isChecked(permission)"
              (change)="togglePermission(permission)"
            >
              {{ formatPermission(permission) }}
            </mat-checkbox>
          }
        </div>
      </div>
    }
  </div>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-button
    type="button"
    (click)="onCancel()"
  >
    Cancel
  </button>

  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="loading"
    (click)="onSubmit()"
  >
    {{ loading ? 'Saving...' : 'Save Role' }}
  </button>
</mat-dialog-actions>
