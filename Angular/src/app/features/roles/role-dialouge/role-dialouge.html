<h2 mat-dialog-title>
  {{ data.mode === 'add' ? 'Add Role' : 'Edit Role' }}
</h2>

<mat-dialog-content class="dialog-content">

  <div class="form-grid">

    <mat-form-field appearance="outline">
      <mat-label>Role Name</mat-label>
      <input matInput [(ngModel)]="form.name" placeholder="ADMIN"
        [disabled]="data.mode === 'edit' && form.name === 'SUPER_ADMIN'" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select [(ngModel)]="form.status">
        <mat-option [value]="true">Active</mat-option>
        <mat-option [value]="false">Inactive</mat-option>
      </mat-select>
    </mat-form-field>

  </div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <textarea matInput rows="2" [(ngModel)]="form.description" placeholder="Role description"></textarea>
  </mat-form-field>

  <h3>Permissions</h3>

  @for (group of permissionGroups; track group.category) {
  <div class="permission-section">
    <h4>{{ group.category }}</h4>
    <div class="permission-grid">
      @for (perm of group.permissions; track perm.key) {
      <mat-checkbox [checked]="isChecked(perm.key)" (change)="togglePermission(perm.key)">
        {{ perm.label }}
      </mat-checkbox>
      }
    </div>
  </div>
  }

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">
    Cancel
  </button>

  <button mat-flat-button color="primary" type="button" [disabled]="loading" (click)="onSubmit()">
    {{ loading ? 'Saving...' : 'Save Role' }}
  </button>
</mat-dialog-actions>
