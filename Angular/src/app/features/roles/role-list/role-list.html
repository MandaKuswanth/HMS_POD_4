<main class="content">
  <app-maincomponent
    title="Roles"
    [recordCount]="totalRecords"
    toolbarColumns="minmax(260px, 1fr) 82px 76px"
  >

    <input
      hms-toolbar
      class="hms-search-input"
      type="text"
      placeholder="Search roles..."
      [(ngModel)]="searchText"
      (ngModelChange)="applyFilter()"
    />

    <button
      hms-toolbar
      mat-stroked-button
      color="warn"
      class="hms-clear-button"
      type="button"
      (click)="clearSearch()"
    >
      <mat-icon>refresh</mat-icon>
      Clear
    </button>

    <button
      hms-toolbar
      *appHasPermission="PERMISSIONS.ROLE_CREATE"
      mat-flat-button
      color="primary"
      class="hms-add-button"
      type="button"
      matTooltip="Add Role"
      (click)="openAddDialog()"
    >
      <mat-icon>add</mat-icon>
      Add
    </button>

    <table
      hms-table
      mat-table
      [dataSource]="dataSource"
      class="hms-data-table role-table"
    >

      <ng-container matColumnDef="roleId">
        <th mat-header-cell *matHeaderCellDef>Role ID</th>
        <td mat-cell *matCellDef="let role">
          <strong class="hms-primary-text">{{ role.roleId || '-' }}</strong>
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Role Name</th>
        <td mat-cell *matCellDef="let role">
          <strong>{{ role.name || '-' }}</strong>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let role">
          {{ role.description || '-' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="permissions">
        <th mat-header-cell *matHeaderCellDef>Permissions</th>
        <td mat-cell *matCellDef="let role">
          <span class="hms-chip blue">{{ role.permissions?.length || 0 }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let role">
          <span [class]="role.status ? 'hms-chip active' : 'hms-chip inactive'">
            {{ role.status ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let role">
          <div class="hms-inline-actions">
            <button
              *appHasPermission="PERMISSIONS.ROLE_UPDATE"
              mat-icon-button
              type="button"
              matTooltip="Edit Role"
              (click)="openEditDialog(role)"
            >
              <mat-icon>edit</mat-icon>
            </button>

            <button
              *appHasPermission="PERMISSIONS.ROLE_DELETE"
              mat-icon-button
              color="warn"
              type="button"
              matTooltip="Delete Role"
              [disabled]="role.name === 'SUPER_ADMIN'"
              (click)="deleteRole(role)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hms-row"></tr>

    </table>

    @if (dataSource.data.length === 0) {
      <div hms-empty class="hms-no-data">
        <mat-icon>admin_panel_settings</mat-icon>
        <p>No roles found</p>
      </div>
    }

    <mat-paginator
      hms-paginator
      [length]="totalRecords"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
      (page)="onPageChange($event)"
    >
    </mat-paginator>

  </app-maincomponent>
</main>
