<h2 mat-dialog-title>
  {{ data?.mode === 'edit' ? 'Update Node' : 'Create Node' }}
</h2>

<mat-dialog-content>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Node Name</mat-label>
    <input matInput [ngModel]="formData.name" (ngModelChange)="onNameChange($event)" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Path</mat-label>
    <input matInput [(ngModel)]="formData.path" placeholder="/employees" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Icon</mat-label>
    <input matInput [(ngModel)]="formData.icon" placeholder="groups" />
  </mat-form-field>

  <div class="form-field-wrapper">
    <label class="field-label">Parent Node</label>
    <app-search-dropdown
      [searchFn]="searchParentNodes"
      [displayField]="'name'"
      [valueField]="'nodeId'"
      [initialDisplay]="formData.parentNodeId || 'No Parent'"
      [(ngModel)]="formData.parentNodeId"
      placeholder="Select parent node..."
    ></app-search-dropdown>
  </div>

  <mat-form-field appearance="outline" class="full-width" style="margin-top: 15px;">
    <mat-label>Order</mat-label>
    <input matInput type="number" [(ngModel)]="formData.order" />
  </mat-form-field>

  <div class="form-field-wrapper">
    <label class="field-label">Status</label>
    <app-search-dropdown
      [searchFn]="searchStatus"
      [displayField]="'name'"
      [valueField]="'_id'"
      [initialDisplay]="formData.status ? 'Active' : 'Inactive'"
      [(ngModel)]="formData.status"
      placeholder="Select status..."
    ></app-search-dropdown>
  </div>

  <div class="permission-section" style="margin-top: 15px;">
    <h3>Permissions</h3>

    <div class="permission-section">
      <h3>Auto-generated Permission</h3>

      @if (formData.permissions.length > 0) {
      <p>{{ formData.permissions[0] }}</p>
      } @else {
      <p>Enter node name to generate permission</p>
      }
    </div>
  </div>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close>
    Cancel
  </button>

  <button mat-flat-button color="primary" (click)="save()">
    {{ data?.mode === 'edit' ? 'Update' : 'Save' }}
  </button>
</mat-dialog-actions>
