    <mat-card class="table-card">

      <div class="page-header">

        <div class="header-left">
          <mat-icon>category</mat-icon>

          <div>
            <h2>Node Management</h2>
            <p>Manage sidebar nodes and menu structure</p>
          </div>
        </div>

        <button
          mat-fab
          color="primary"
          (click)="openAddDialog()">

          <mat-icon>add</mat-icon>

        </button>

      </div>

      <div class="toolbar">

        <div class="search-container">

          <input
            class="search-input"
            type="text"
            placeholder="Search nodes..."
            [ngModel]="searchTextSignal()"
            (input)="onSearchInput($event)">

        </div>

      </div>

      <div class="table-wrapper">

        <table mat-table [dataSource]="nodesSignal()">

          <ng-container matColumnDef="nodeId">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let node">
              {{ node.nodeId }}
            </td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let node">
              {{ node.name }}
            </td>
          </ng-container>

          <ng-container matColumnDef="path">
            <th mat-header-cell *matHeaderCellDef>Path</th>
            <td mat-cell *matCellDef="let node">
              {{ node.path }}
            </td>
          </ng-container>

          <ng-container matColumnDef="icon">
            <th mat-header-cell *matHeaderCellDef>Icon</th>
            <td mat-cell *matCellDef="let node">
              {{ node.icon }}
            </td>
          </ng-container>

          <ng-container matColumnDef="order">
            <th mat-header-cell *matHeaderCellDef>Order</th>
            <td mat-cell *matCellDef="let node">
              {{ node.order }}
            </td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let node">

              <span
                [class]="node.status ? 'badge active' : 'badge inactive'">

                {{ node.status ? 'Active' : 'Inactive' }}

              </span>

            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>

            <td mat-cell *matCellDef="let node">

              <button
                mat-icon-button
                (click)="openEditDialog(node)">

                <mat-icon>edit</mat-icon>

              </button>

              <button
                mat-icon-button
                color="warn"
                (click)="deleteNode(node)">

                <mat-icon>delete</mat-icon>

              </button>

            </td>

          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>

      </div>

      <mat-paginator
        [length]="totalSignal()"
        [pageIndex]="pageSignal()"
        [pageSize]="limitSignal()"
        [pageSizeOptions]="pageSizeOptions"
        showFirstLastButtons
        (page)="onPageChange($event)">
      </mat-paginator>

    </mat-card>
