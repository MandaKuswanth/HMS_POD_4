<h2 mat-dialog-title>
    {{ data?.mode === 'edit'
    ? 'Update Health Record'
    : 'Create Health Record' }}
</h2>

<mat-dialog-content>

    <!-- Appointment -->
    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Appointment</mat-label>

        <mat-select [(ngModel)]="formData.appointmentId" (selectionChange)="onAppointmentChange()"
            [disabled]="data?.mode === 'edit'">
            @for (appointment of appointments; track appointment.appointmentId) {
            <mat-option [value]="appointment.appointmentId">
                {{ appointment.appointmentId }}
                |
                {{ appointment.patientName }}
                |
                Dr. {{ appointment.doctorName }}
            </mat-option>
            }

        </mat-select>
    </mat-form-field>

    <!-- Symptoms -->
    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Symptoms</mat-label>

        <textarea matInput rows="3" [(ngModel)]="formData.symptoms" placeholder="Enter symptoms">
    </textarea>
    </mat-form-field>

    <!-- Diagnosis -->
    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Diagnosis</mat-label>

        <textarea matInput rows="3" [(ngModel)]="formData.diagnosis" placeholder="Enter diagnosis">
    </textarea>
    </mat-form-field>

    <!-- Prescription -->
    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Prescription</mat-label>

        <textarea matInput rows="3" [(ngModel)]="formData.prescription" placeholder="Enter prescription">
    </textarea>
    </mat-form-field>

    <!-- Notes -->
    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Notes</mat-label>

        <textarea matInput rows="3" [(ngModel)]="formData.notes" placeholder="Additional notes">
    </textarea>
    </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">

    <button mat-stroked-button mat-dialog-close>
        Cancel
    </button>

    <button mat-flat-button color="primary" (click)="save()">
        {{ data?.mode === 'edit'
        ? 'Update'
        : 'Save' }}
    </button>

</mat-dialog-actions>
