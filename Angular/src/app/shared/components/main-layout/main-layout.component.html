<div class="layout">
  <app-sidebar [class.open]="sidebarOpen()"></app-sidebar>

  @if (sidebarOpen()) {
    <div
      class="sidebar-overlay"
      role="button"
      tabindex="0"
      aria-label="Close menu"
      (click)="closeSidebar()"
      (keydown.enter)="closeSidebar()"
      (keydown.space)="closeSidebar()"
    ></div>
  }

  <div class="main-content">
    <app-navbar (menuToggle)="toggleSidebar()"></app-navbar>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
